# Tulu 3.1 pilot, arm s2e-3. Preregistered in docs/end_to_end/03-tulu31-pilot.md,
# committed before its run. One config per arm; the run directory is named after it.
model: TULU31_START
data: data/tulu31
population: 16            # the RL run's 16 samples per prompt: rollouts match per step
prompts_per_member: 192   # RL steps 4g+1 to 4g+4, in the run's order
sigma: 0.002
alpha: 0.0005             # Qiu et al.'s step; lr = alpha * sigma
reward: verifiers
iterations: 30            # RL steps 1 to 120
seed: 0
max_tokens: 2048          # the run's --response_length
max_model_len: 4096
gpu_memory_utilization: 0.5   # the f32 master (32 GB) and noise buffers take the rest
check_members: [0]
digest_every: 5
eval_center: true
