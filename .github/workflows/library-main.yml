# Does the library's main still run this repository's drivers?
#
# requirements.txt pins the library to one commit, results are made with that commit, and
# ci.yml tests exactly that. This asks the other question: if the pin moved to the
# library's main today, what would break?
#
# Weekly and by hand, never on a pull request: a red mark there would be about the
# library's main and not about the change under review. A failure here blocks nothing. It
# means the next pin move has work attached, and that is cheaper to learn the week it
# happens than the day a result needs something new from the library.
name: library main

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:

jobs:
  drivers:
    name: driver tests against shardes main
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: andreshernandez-spec/shardes
          ref: main
          path: shardes-lib
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install the pinned environment, then the library's main over it
        run: |
          pip install -r requirements.txt
          pip install --no-deps -e ./shardes-lib
      # Without this the job can pass by testing the pin, which is what ci.yml already
      # does and says nothing about main.
      - name: what is under test is the library's main, not the pin
        run: |
          python - <<'PY'
          import pathlib, re, subprocess
          import shardes

          lib = pathlib.Path("shardes-lib").resolve()
          here = pathlib.Path(shardes.__file__).resolve()
          assert lib in here.parents, f"imported {here}, not the clone of main"
          head = subprocess.run(["git", "-C", str(lib), "rev-parse", "HEAD"],
                                capture_output=True, text=True, check=True).stdout.strip()
          pin = re.search(r"shardes@([0-9a-f]{40})", open("requirements.txt").read()).group(1)
          ahead = subprocess.run(["git", "-C", str(lib), "rev-list", "--count", f"{pin}..{head}"],
                                 capture_output=True, text=True, check=True).stdout.strip()
          print(f"shardes {shardes.__version__} at {head}")
          print(f"the pin is {pin}; main is {ahead} commit(s) past it")
          PY
      - name: pytest
        env:
          SHARDES_REPO: ${{ github.workspace }}/shardes-lib
        run: pytest -rs
      - name: every generated table still reproduces byte for byte
        env:
          JAX_PLATFORMS: cpu
        run: |
          make -C paper tables
          git diff --exit-code -- paper/generated
